name: Polyglot CI Verification & GitHub Pages Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run .NET 10 xUnit Concurrency & Kestrel Integration Suite
        working-directory: services/aegis-kernel-dotnet
        run: dotnet test AegisKernel.sln -c Release --nologo

      - name: Execute 10,000-Request .NET Flash-Sale Benchmark
        working-directory: services/aegis-kernel-dotnet
        run: dotnet run --project benchmarks/AegisKernel.Benchmarks/AegisKernel.Benchmarks.csproj -c Release -- ../../benchmarks/dotnet-benchmark-report.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python Hybrid RAG & ReAct Agent Pytest Suite
        working-directory: services/aegis-sre-agent-python
        env:
          PYTHONPATH: .
        run: |
          pip install -r requirements.txt
          pytest -v
          python tests/test_rag_and_agent.py

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Vitest Suite & Build Mission Control Web Bundle
        working-directory: web/mission-control
        run: |
          npm install
          npm test
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/mission-control/dist

  deploy-pages:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
