global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'aegispulse-api-dotnet10'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:5080']
        labels:
          service: 'aegispulse-api'
          tier: 'voucher-concurrency'

  - job_name: 'aegispulse-otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'otel-collector'
