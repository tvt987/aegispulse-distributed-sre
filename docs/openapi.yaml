openapi: 3.1.0
info:
  title: AegisPulse Distributed SRE & Voucher Concurrency API
  version: 5.0.0
  summary: High-Concurrency .NET 10 Voucher Redemption, SQL Server Plan Advisor & 5-Region Quorum SRE Control Plane
  description: |
    Production OpenAPI 3.1 contract for AegisPulse v5.0 (`backend/src/AegisPulse.Api`),
    implementing Truong Van Tinh's Con Cung 700-Store / 5,000+ RPS architecture:
    - Single-threaded Redis Lua `EVALSHA` atomic quota gate
    - RFC `Idempotency-Key` SHA-256 payload fingerprinting & response replay cache
    - SQL Server `ROWVERSION` optimistic concurrency persistence & 5M-row covering-index plan advisor via Dapper
    - 5-Region Raft Quorum (`VN-HCM`, `SG-1`, `JP-Tokyo`, `US-East`, `EU-West`) split-brain `READ_ONLY_FENCE` evaluation & Adaptive Circuit Breaker telemetry
  contact:
    name: Truong Van Tinh
    email: tinhkun102@gmail.com
    url: https://github.com/tvt987/aegispulse-distributed-sre
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:5080
    description: Local .NET 10 Kestrel / Docker Compose API
  - url: http://localhost:8080
    description: Nginx Reverse Proxy (Docker Compose Web Gateway)

tags:
  - name: Health
    description: Service liveness, readiness, and Prometheus metrics exposition
  - name: Vouchers
    description: Atomic high-concurrency promo voucher seeding, redemption, and audit proof
  - name: SRE
    description: 5-Region Raft quorum consensus and Adaptive Circuit Breaker telemetry
  - name: SQL Advisor
    description: 5,000,000-row SQL Server execution plan modeling & Dapper covering index DDL advisor
  - name: Cluster Quorum
    description: 5-Region Raft quorum failover & automatic READ_ONLY_FENCE split-brain evaluation

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service health and zero-double-spend invariant check
      responses:
        '200':
          description: Service health payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /metrics:
    get:
      tags: [Health]
      operationId: getPrometheusMetrics
      summary: Prometheus text exposition metrics endpoint
      responses:
        '200':
          description: Prometheus exposition format (`text/plain; version=0.0.4`)
          content:
            text/plain:
              schema:
                type: string

  /api/v1/vouchers/seed:
    post:
      tags: [Vouchers]
      operationId: seedVoucher
      summary: Create or reset a promo voucher campaign with exact initial stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedVoucherRequest'
            example:
              code: CONCUNG-VIP-500K
              faceValueVnd: 500000
              initialStock: 1
              campaignName: Con Cung 700-Store Flash-Sale Promo
      responses:
        '201':
          description: Voucher seeded and ready for atomic redemption
          headers:
            Location:
              description: URI of the seeded voucher audit ledger
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherAuditSnapshot'
        '400':
          description: Validation error (empty code, non-positive stock or face value)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/vouchers/{code}/redeem:
    post:
      tags: [Vouchers]
      operationId: redeemVoucher
      summary: Atomically redeem a promo voucher with strict Idempotency-Key deduplication
      description: |
        Executes the two-layer Con Cung concurrency guard:
        1. Validates mandatory `Idempotency-Key` header (`400 Bad Request` if omitted).
        2. Evaluates the Redis Lua atomic gate and SHA-256 idempotency response cache.
        3. Commits the SQL Server `ROWVERSION` optimistic concurrency decrement.
        4. Guarantees strictly `0.00%` double-spending across parallel flash-sale storms.
      parameters:
        - name: code
          in: path
          required: true
          description: Promo voucher code (case-insensitive, normalized uppercase)
          schema:
            type: string
            example: CONCUNG-VIP-500K
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique client-generated idempotency token preventing duplicate charges on retry
          schema:
            type: string
            minLength: 1
            example: cc-pos-store088-9b71c4a2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemVoucherRequest'
            example:
              customerId: cust-vip-8821
              storeCode: STORE-088
      responses:
        '200':
          description: Voucher atomically redeemed or safely replayed from idempotency cache
          headers:
            X-Idempotent-Replay:
              description: '`true` when served from idempotency response cache, `false` for fresh commit'
              schema:
                type: string
                enum: ['true', 'false']
            X-RowVersion:
              description: Monotonic 64-bit SQL Server ROWVERSION token hex string
              schema:
                type: string
                example: '0x0000000000000002'
            X-Latency-Us:
              description: Server-side execution time in microseconds
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherRedemptionReceipt'
        '400':
          description: Missing or blank `Idempotency-Key` header
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Voucher code does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Voucher exhausted (race lost cleanly), ROWVERSION conflict, or Idempotency-Key payload mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Adaptive Circuit Breaker is OPEN to protect downstream SQL Server pools
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/vouchers/{code}/audit:
    get:
      tags: [Vouchers]
      operationId: getVoucherAudit
      summary: Retrieve immutable voucher stock invariant audit ledger
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: CONCUNG-VIP-500K
      responses:
        '200':
          description: Full voucher audit snapshot including doubleSpendCount and recent events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherAuditSnapshot'
        '404':
          description: Voucher code not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/sre/cluster-status:
    get:
      tags: [SRE]
      operationId: getSreClusterStatus
      summary: Inspect 5-region Raft quorum health, circuit breaker state, and voucher SLO metrics
      responses:
        '200':
          description: Live SRE control plane status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SreClusterStatusResponse'

  /api/v1/sql/execution-plan:
    post:
      tags: [SQL Advisor]
      operationId: evaluateSqlExecutionPlan
      summary: Compute SQL Server execution operator tree, logical reads, p99 latency & covering index DDL
      description: |
        Models Con Cung's 5,000,000-row `dbo.Vouchers` + `dbo.VoucherRedemptions` query across 3 stages:
        - `LegacyEfCoreScan` (`28.4 ms`, `14,200` logical reads, `125 MB` heap, table lock escalation)
        - `CoveringIndexDapperCas` (`1.8 ms`, `14` logical reads, `18 MB` RAM, `-93.7%` latency)
        - `RedisLuaWriteBehind` (`0.42 ms`, `0` SQL contention reads on bursts)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlExecutionPlanRequest'
            example:
              stage: CoveringIndexDapperCas
              tableRowCount: 5000000
              concurrencyRps: 5000
              voucherCode: CONCUNG-VIP-500K
      responses:
        '200':
          description: Deterministic SQL Server operator tree, metrics, and generated T-SQL/Dapper/Lua artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlExecutionPlanEvaluation'
        '400':
          description: Invalid stage, row count, or concurrency RPS
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/cluster/quorum-evaluate:
    post:
      tags: [Cluster Quorum]
      operationId: evaluateClusterQuorum
      summary: Evaluate 5-region Raft quorum, automatic leader election, READ_ONLY_FENCE safety & RPO/RTO
      description: |
        Evaluates any regional health bitmap across `vn-hcm`, `sg-1`, `jp-tokyo`, `us-east`, and `eu-west`
        (`Online`, `Partitioned`, or `HardCrash`). Automatically enforces `READ_ONLY_FENCE` when `< 3/5`
        nodes remain online to prevent dual-writer voucher double-spending.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterQuorumEvaluateRequest'
            example:
              currentTerm: 42
              previousLeaderId: vn-hcm
              regionStates:
                vn-hcm: HardCrash
                sg-1: Online
                jp-tokyo: Online
                us-east: Online
                eu-west: Online
      responses:
        '200':
          description: Deterministic quorum state, elected leader, write-fence decision, WAL lag, and RPO/RTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuorumEvaluationResult'
        '400':
          description: Unknown region identifier or unsupported health state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
        - runtime
        - architecture
        - raftQuorum
        - circuitBreaker
        - doubleSpendCount
        - invariantIntact
        - timestampUtc
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        service:
          type: string
        version:
          type: string
        runtime:
          type: string
        architecture:
          type: string
        raftQuorum:
          type: string
        circuitBreaker:
          type: string
          enum: [Closed, Open, HalfOpen]
        doubleSpendCount:
          type: integer
          minimum: 0
        invariantIntact:
          type: boolean
        timestampUtc:
          type: string
          format: date-time

    SeedVoucherRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
        faceValueVnd:
          type: integer
          format: int64
          default: 500000
          minimum: 1
        initialStock:
          type: integer
          default: 1
          minimum: 1
        campaignName:
          type: string
          nullable: true

    RedeemVoucherRequest:
      type: object
      properties:
        customerId:
          type: string
          nullable: true
        storeCode:
          type: string
          nullable: true

    VoucherRedemptionReceipt:
      type: object
      required:
        - redemptionId
        - voucherCode
        - customerId
        - storeCode
        - idempotencyKey
        - faceValueVnd
        - remainingStockAfter
        - rowVersion
        - rowVersionHex
        - isIdempotentReplay
        - outcome
        - latencyMicroseconds
        - redeemedAtUtc
      properties:
        redemptionId:
          type: string
        voucherCode:
          type: string
        customerId:
          type: string
        storeCode:
          type: string
        idempotencyKey:
          type: string
        faceValueVnd:
          type: integer
          format: int64
        remainingStockAfter:
          type: integer
          minimum: 0
        rowVersion:
          type: integer
          format: int64
        rowVersionHex:
          type: string
        isIdempotentReplay:
          type: boolean
        outcome:
          type: string
          enum:
            - Redeemed
            - IdempotentReplay
            - VoucherExhausted
            - RowVersionConflict
            - IdempotencyPayloadMismatch
            - VoucherNotFound
            - CircuitBreakerOpen
        latencyMicroseconds:
          type: integer
          format: int64
        redeemedAtUtc:
          type: string
          format: date-time

    VoucherAuditEvent:
      type: object
      required:
        - eventId
        - eventType
        - customerId
        - storeCode
        - idempotencyKey
        - rowVersion
        - remainingStockAfter
        - timestampUtc
      properties:
        eventId:
          type: string
        eventType:
          type: string
        customerId:
          type: string
        storeCode:
          type: string
        idempotencyKey:
          type: string
        rowVersion:
          type: integer
          format: int64
        remainingStockAfter:
          type: integer
        timestampUtc:
          type: string
          format: date-time

    VoucherAuditSnapshot:
      type: object
      required:
        - code
        - campaignName
        - faceValueVnd
        - initialStock
        - remainingStock
        - approvedRedemptions
        - rejectedConflicts409
        - idempotentReplays
        - rowVersionConflicts
        - doubleSpendCount
        - invariantIntact
        - currentRowVersion
        - currentRowVersionHex
        - recentEvents
      properties:
        code:
          type: string
        campaignName:
          type: string
        faceValueVnd:
          type: integer
          format: int64
        initialStock:
          type: integer
        remainingStock:
          type: integer
        approvedRedemptions:
          type: integer
        rejectedConflicts409:
          type: integer
        idempotentReplays:
          type: integer
        rowVersionConflicts:
          type: integer
        doubleSpendCount:
          type: integer
        invariantIntact:
          type: boolean
        currentRowVersion:
          type: integer
          format: int64
        currentRowVersionHex:
          type: string
        recentEvents:
          type: array
          items:
            $ref: '#/components/schemas/VoucherAuditEvent'

    RaftRegionNode:
      type: object
      required: [regionId, displayName, baseLatencyMs, reachable, role, fencingToken]
      properties:
        regionId:
          type: string
        displayName:
          type: string
        baseLatencyMs:
          type: integer
        reachable:
          type: boolean
        role:
          type: string
          enum: [Leader, Follower, Partitioned, Fenced]
        fencingToken:
          type: integer
          format: int64

    SreClusterStatusResponse:
      type: object
      required: [service, version, raft, circuitBreaker, voucherEngine, slo, timestampUtc]
      properties:
        service:
          type: string
        version:
          type: string
        raft:
          type: object
          properties:
            quorumStatus:
              type: string
            totalNodes:
              type: integer
            quorumRequired:
              type: integer
            reachableNodes:
              type: integer
            hasQuorum:
              type: boolean
            splitBrainWriteFenceActive:
              type: boolean
            leaderRegionId:
              type: string
              nullable: true
            raftTerm:
              type: integer
              format: int64
            regions:
              type: array
              items:
                $ref: '#/components/schemas/RaftRegionNode'
        circuitBreaker:
          type: object
          properties:
            state:
              type: string
              enum: [Closed, Open, HalfOpen]
            consecutiveFailures:
              type: integer
            failureThreshold:
              type: integer
            openCooldownSeconds:
              type: number
            openedAtUtc:
              type: string
              format: date-time
              nullable: true
        voucherEngine:
          type: object
          properties:
            totalRequests:
              type: integer
              format: int64
            totalApproved:
              type: integer
              format: int64
            totalConflicts409:
              type: integer
              format: int64
            totalIdempotentReplays:
              type: integer
              format: int64
            totalDoubleSpends:
              type: integer
            doubleSpendRatePct:
              type: number
            invariantIntact:
              type: boolean
            activeVouchers:
              type: integer
        slo:
          type: object
          properties:
            targetRps:
              type: integer
            targetP99Ms:
              type: number
            storeFootprint:
              type: integer
            pattern:
              type: string
        timestampUtc:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details error payload
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    SqlExecutionPlanRequest:
      type: object
      properties:
        stage:
          type: string
          enum: [LegacyEfCoreScan, CoveringIndexDapperCas, RedisLuaWriteBehind]
          default: CoveringIndexDapperCas
        tableRowCount:
          type: integer
          format: int64
          minimum: 1
          default: 5000000
        concurrencyRps:
          type: integer
          minimum: 1
          default: 5000
        voucherCode:
          type: string
          nullable: true
          default: CONCUNG-VIP-500K

    SqlPlanOperator:
      type: object
      required:
        - id
        - name
        - physicalOp
        - costPercent
        - logicalReads
        - cpuMs
        - estimatedRows
        - lockGranularity
        - waitType
      properties:
        id:
          type: string
        name:
          type: string
        physicalOp:
          type: string
        costPercent:
          type: integer
        logicalReads:
          type: integer
          format: int64
        cpuMs:
          type: number
        estimatedRows:
          type: integer
          format: int64
        lockGranularity:
          type: string
        waitType:
          type: string
        warning:
          type: string
          nullable: true

    SqlStageSummary:
      type: object
      required:
        - stage
        - stageCode
        - title
        - executionTimeMs
        - p99LatencyMs
        - logicalReads
        - memoryFootprintMb
        - latencyReductionPctVsLegacy
        - lockEscalationRisk
      properties:
        stage:
          type: string
          enum: [LegacyEfCoreScan, CoveringIndexDapperCas, RedisLuaWriteBehind]
        stageCode:
          type: string
        title:
          type: string
        executionTimeMs:
          type: number
        p99LatencyMs:
          type: number
        logicalReads:
          type: integer
          format: int64
        memoryFootprintMb:
          type: number
        latencyReductionPctVsLegacy:
          type: number
        lockEscalationRisk:
          type: string

    SqlExecutionPlanEvaluation:
      type: object
      required:
        - stage
        - stageCode
        - title
        - subtitle
        - tableRowCount
        - concurrencyRps
        - voucherCode
        - executionTimeMs
        - p99LatencyMs
        - logicalReads
        - memoryFootprintMb
        - latencyReductionPctVsLegacy
        - lockGranularity
        - lockEscalationRisk
        - hasLockEscalationWarning
        - operators
        - recommendedIndexDdl
        - recommendedDapperCSharp
        - recommendedRedisLua
        - allStagesComparison
      properties:
        stage:
          type: string
          enum: [LegacyEfCoreScan, CoveringIndexDapperCas, RedisLuaWriteBehind]
        stageCode:
          type: string
        title:
          type: string
        subtitle:
          type: string
        tableRowCount:
          type: integer
          format: int64
        concurrencyRps:
          type: integer
        voucherCode:
          type: string
        executionTimeMs:
          type: number
        p99LatencyMs:
          type: number
        logicalReads:
          type: integer
          format: int64
        memoryFootprintMb:
          type: number
        latencyReductionPctVsLegacy:
          type: number
        lockGranularity:
          type: string
        lockEscalationRisk:
          type: string
        hasLockEscalationWarning:
          type: boolean
        operators:
          type: array
          items:
            $ref: '#/components/schemas/SqlPlanOperator'
        recommendedIndexDdl:
          type: string
        recommendedDapperCSharp:
          type: string
        recommendedRedisLua:
          type: string
        allStagesComparison:
          type: array
          items:
            $ref: '#/components/schemas/SqlStageSummary'

    ClusterQuorumEvaluateRequest:
      type: object
      properties:
        currentTerm:
          type: integer
          format: int64
          default: 42
        previousLeaderId:
          type: string
          nullable: true
          default: vn-hcm
        regionStates:
          type: object
          additionalProperties:
            type: string
            enum: [Online, Partitioned, HardCrash, ONLINE, PARTITIONED, HARD_CRASH]

    QuorumNodeSnapshot:
      type: object
      required:
        - regionId
        - displayName
        - location
        - state
        - role
        - rttToLeaderMs
        - walReplicationLagMs
        - fencingToken
        - acceptsWrites
      properties:
        regionId:
          type: string
        displayName:
          type: string
        location:
          type: string
        state:
          type: string
          enum: [Online, Partitioned, HardCrash]
        role:
          type: string
          enum: [Leader, Follower, Partitioned, Crashed, Fenced]
        rttToLeaderMs:
          type: integer
        walReplicationLagMs:
          type: number
        fencingToken:
          type: integer
          format: int64
        acceptsWrites:
          type: boolean

    QuorumEvaluationResult:
      type: object
      required:
        - totalNodes
        - quorumRequired
        - onlineNodes
        - partitionedNodes
        - crashedNodes
        - hasQuorum
        - clusterWriteMode
        - splitBrainFenceActive
        - doubleSpendPrevented
        - raftTerm
        - electionTriggered
        - quorumCommitRttMs
        - maxWalReplicationLagMs
        - rpoSeconds
        - rtoSummary
        - decisionReason
        - nodes
      properties:
        totalNodes:
          type: integer
        quorumRequired:
          type: integer
        onlineNodes:
          type: integer
        partitionedNodes:
          type: integer
        crashedNodes:
          type: integer
        hasQuorum:
          type: boolean
        clusterWriteMode:
          type: string
          enum: [READ_WRITE, READ_ONLY_FENCE]
        splitBrainFenceActive:
          type: boolean
        doubleSpendPrevented:
          type: boolean
        electedLeaderRegionId:
          type: string
          nullable: true
        electedLeaderName:
          type: string
          nullable: true
        raftTerm:
          type: integer
          format: int64
        electionTriggered:
          type: boolean
        quorumCommitRttMs:
          type: integer
        maxWalReplicationLagMs:
          type: number
        rpoSeconds:
          type: number
        rtoMs:
          type: integer
          nullable: true
        rtoSummary:
          type: string
        decisionReason:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/QuorumNodeSnapshot'
